[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psit-agent"
version = "0.1.0"
description = "Pharma Safety Intake & Triage Knowledge Agent - fictional-data training prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32", "plotly>=5.20", "pandas>=2.0"]
rag = ["pypdf>=4.0", "python-docx>=1.1", "numpy>=1.26", "faiss-cpu>=1.8", "sentence-transformers>=3.0"]
docs = ["reportlab>=4.0"]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-playwright>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["e2e: Playwright end-to-end tests (need running servers)", "slow: loads real BGE models"]
